# Local dev only. Credentials here are throwaway dev values; never reuse them elsewhere.
name: slotfill

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slotfill_owner
      POSTGRES_PASSWORD: slotfill_owner
      POSTGRES_DB: slotfill
    ports:
      # Host 5433 because 5432 is commonly taken by a locally installed Postgres.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slotfill_owner -d slotfill']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

volumes:
  pgdata:
